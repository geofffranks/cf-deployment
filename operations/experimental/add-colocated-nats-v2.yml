- type: replace
  path: /instance_groups/name=nats/jobs/name=nats-v2-tls?
  value:
    properties:
      nats:
        client:
          tls:
            certificate: ((nats_client_cert.certificate))
            private_key: ((nats_client_cert.private_key))
        external:
          tls:
            ca: ((nats_client_cert.ca))
            certificate: ((nats_server_cert.certificate))
            private_key: ((nats_server_cert.private_key))
        hostname: nats.service.cf.internal
        internal:
          tls:
            ca: ((nats_internal_cert.ca))
            certificate: ((nats_internal_cert.certificate))
            enabled: true
            private_key: ((nats_internal_cert.private_key))
        password: ((nats_password))
        user: nats
      provides:
        nats-v2-tls:
          as: nats-v2-tls
          shared: true
      consumes:
        nats-v2-tls:
          as: nats-v2-tls
      release: nats-v2
- type: replace
  path: /releases/name=nats-v2?
  value: latest

- type: replace
  path: /instance_groups/name=nats/jobs/name=nats-tls/provides?/nats-tls
  value:
    as: nats-v1-tls
    shared: true

- type: replace
  path: /instance_groups/name=singleton-blobstore/jobs/name=route_registrar/consumes?/nats-tls
  value:
    from: nats-v1-tls
